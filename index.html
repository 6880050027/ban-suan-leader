<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เส้นทางผู้บริหาร เมืองบ้านสวน</title>
<meta name="description" content="เกมเตรียมความพร้อมผู้บริหารสถานศึกษามัธยมศึกษาไทย 20 ด่าน ในเมือง 3 มิติ">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='22' width='52' height='34' rx='8' fill='%23F4E6CF'/%3E%3Cpath d='M4 26 32 6l28 20z' fill='%23E08A5B'/%3E%3Crect x='26' y='38' width='12' height='18' rx='3' fill='%235B8DD6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<div id="world" aria-label="เมืองบ้านสวน ภาพ 3 มิติ"></div>
<div id="labels" aria-hidden="false"></div>

<header id="hud">
  <div class="hud-card who">
    <div class="who-top"><b id="hud-name">ท่าน ผอ.</b><span class="chip" id="hud-progress">0/20 ด่าน</span></div>
    <div class="rank"><span id="hud-rank">ผู้บริหารฝึกหัด</span> <small id="hud-rank-sub"></small></div>
    <div class="exp"><div class="bar"><i id="hud-exp-bar"></i></div><small id="hud-exp">0 EXP</small></div>
  </div>
  <button class="hud-card fin" id="hud-fin" data-act="finance" data-arg="overview" title="งบประมาณโรงเรียน">
    <div class="fin-row"><span>นักเรียน</span><b id="hud-students">–</b></div>
    <div class="fin-row"><span id="hud-size">–</span></div>
    <div class="fin-row"><span>งบใช้ได้</span><b id="hud-money">–</b></div>
    <span class="crisis-tag" id="hud-crisis" hidden>ภาวะวิกฤต</span>
  </button>
  <div class="hud-card meters" title="ตัวชี้วัดในเกม ไม่ใช่การวัดจริง">
    <div class="meter" id="m-keng"><span>เก่ง</span><div class="bar"><i></i></div><b>–</b></div>
    <div class="meter" id="m-dee"><span>ดี</span><div class="bar"><i></i></div><b>–</b></div>
    <div class="meter" id="m-suk"><span>มีสุข</span><div class="bar"><i></i></div><b>–</b></div>
  </div>
</header>

<nav id="dock" aria-label="เมนูหลัก">
  <button data-act="board"><svg viewBox="0 0 24 24"><path d="M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Zm2 5h8M8 12h8M8 16h5"/></svg><span>ภารกิจ</span></button>
  <button data-act="finance" data-arg="shop"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 10h-13ZM8 9V7a4 4 0 0 1 8 0v2"/></svg><span>งบและร้านค้า</span></button>
  <button data-act="book"><svg viewBox="0 0 24 24"><path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4Zm0 12a4 4 0 0 1 4-4h9"/></svg><span>สมุดผู้นำ</span></button>
  <button data-act="hall"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0Zm0 1H5v2a3 3 0 0 0 3 3m8-5h3v2a3 3 0 0 1-3 3M12 13v4m-4 3h8l-1-3H9Z"/></svg><span>รางวัล</span></button>
  <button data-act="menu"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span>เมนู</span></button>
</nav>
<div id="visitbar" hidden></div>

<div id="camctl" aria-label="ควบคุมกล้อง">
  <button data-act="zin" aria-label="ซูมเข้า">+</button>
  <button data-act="zout" aria-label="ซูมออก">−</button>
  <button data-act="snap" aria-label="ถ่ายภาพมุมนี้" title="ถ่ายภาพมุมนี้"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4Z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
  <button data-act="home" aria-label="มองทั้งเมือง"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4Z"/></svg></button>
</div>

<div id="tracker" hidden></div>
<div id="reader" hidden><div class="reader-pic"></div><div class="bubble"><b class="who"></b><p class="say"></p></div></div>
<div id="intro" hidden></div>
<div id="flash"></div>
<aside id="sheet" aria-live="polite"></aside>

<div id="modal" class="modal" aria-hidden="true" role="dialog" aria-modal="true">
  <div class="modal-box">
    <button id="modal-close" class="x" data-act="close" aria-label="ปิด">×</button>
    <div id="modal-body"></div>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>

<div id="loading"><div class="spinner"></div><p>กำลังปั้นเมืองบ้านสวน…</p></div>
<div id="nogl" hidden><p>เบราว์เซอร์นี้แสดงภาพ 3 มิติ (WebGL) ไม่ได้ ท่านยังเล่นภารกิจทั้งหมดได้จากเมนู "ภารกิจ" แต่จะไม่เห็นเมือง</p></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
